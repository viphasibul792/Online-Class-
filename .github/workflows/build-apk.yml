name: Build PDF Gallery APK

on:
  push:
    branches: [arena/f9468d58-online-class]
    paths:
      - Pdf.g.v03.zip
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract project
        run: unzip -q Pdf.g.v03.zip -d project
      - name: Diagnose Android SDK
        run: |
          echo "::notice::ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "::notice::sdkmanager=$(command -v sdkmanager || true)"
          echo "::notice::sdk dirs=$(ls -la /usr/local/lib/android/sdk/cmdline-tools/ 2>&1 | tr '\n' ' ')"
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Install Android SDK
        run: |
          set +e
          sdkmanager 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0' > /tmp/sdk.log 2>&1
          code=$?
          tail -c 3000 /tmp/sdk.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit $code
      - name: Create debug signing key
        run: keytool -genkeypair -v -keystore project/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Gallery-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
